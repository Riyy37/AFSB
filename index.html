<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер ОК | УФСБ г. Кемерово</title>
    <style>
        /* ЗАЩИТА ОТ ВЫДЕЛЕНИЯ ТЕКСТА */
        body { 
            background-color: #313338; color: #dbdee1; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; margin: 0;
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10 and IE 11 */
            user-select: none; /* Standard syntax */
        }
        .container { max-width: 900px; margin: 0 auto; background-color: #2b2d31; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1 { color: #ffffff; border-bottom: 2px solid #1e1f22; padding-bottom: 10px; }
        .progress { color: #949ba4; font-size: 14px; margin-bottom: 20px; font-weight: bold; }
        
        .application-box { 
            background-color: #1e1f22; padding: 20px; border-radius: 8px; border: 1px solid #404249; 
            margin-bottom: 20px; white-space: pre-wrap; font-family: monospace; font-size: 14px; 
            line-height: 1.6; max-height: 500px; overflow-y: auto;
        }
        
        .application-box::-webkit-scrollbar { width: 8px; }
        .application-box::-webkit-scrollbar-track { background: #2b2d31; }
        .application-box::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
        
        .actions { display: flex; gap: 15px; }
        button { padding: 12px 24px; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-approve { background-color: #23a559; color: white; }
        .btn-approve:hover { background-color: #1a7c43; }
        .btn-deny { background-color: #da373c; color: white; }
        .btn-deny:hover { background-color: #a1282c; }
        .btn-next { background-color: #5865F2; color: white; width: 100%; display: none; margin-top: 15px;}
        .btn-next:hover { background-color: #4752c4; }
        #feedback { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; font-size: 15px; }
        .correct { background-color: #124326; border: 1px solid #23a559; color: #a6f2c3; }
        .wrong { background-color: #471417; border: 1px solid #da373c; color: #ffb3b6; }
        #result-screen { display: none; text-align: center; }
        #result-screen h2 { color: #ffffff; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Тренажер Отдела Кадров УФСБ</h1>
    
    <div id="quiz-screen">
        <div class="progress" id="progress-text">Анкета 1 из 20</div>
        
        <div class="application-box" id="app-content"></div>

        <div class="actions" id="action-buttons">
            <!-- Передаем цифры вместо слов -->
            <button class="btn-approve" onclick="checkAnswer(1)">✅ Одобрить</button>
            <button class="btn-deny" onclick="checkAnswer(0)">❌ Отказать</button>
        </div>

        <div id="feedback"></div>
        <button class="btn-next" id="btn-next" onclick="nextApp()">Следующая анкета ➔</button>
    </div>

    <div id="result-screen">
        <h2>🏁 Тренировка завершена!</h2>
        <p id="final-score" style="font-size: 18px;"></p>
        <button class="btn-next" style="display: inline-block; width: auto;" onclick="location.reload()">Пройти заново</button>
    </div>
</div>

<script>
    // ЗАЩИТА: Отключение правой кнопки мыши
    document.addEventListener('contextmenu', event => event.preventDefault());

    // ЗАЩИТА: Отключение копирования (даже если выделят через консоль)
    document.addEventListener('copy', event => {
        event.clipboardData.setData('text/plain', 'Копирование запрещено!');
        event.preventDefault();
    });

    // ЗАЩИТА: Отключение кнопок F12, Ctrl+Shift+I, Ctrl+U
    document.onkeydown = function(e) {
        if(e.keyCode == 123) return false; // F12
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; // Ctrl+Shift+I
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false; // Ctrl+Shift+C
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; // Ctrl+Shift+J
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U
    }

    // ==========================================
    // ТУТ ТЫ ДОБАВЛЯЕШЬ СВОИ АНКЕТЫ
    // Внимание! Теперь правильный ответ пишется так: 
    // ans: 1 (Это ОДОБРИТЬ)
    // ans: 0 (Это ОТКАЗАТЬ)
    // ==========================================
    const db = [
        {
            t: `1. Какой возраст вашего персонажа?
27

31. Что такое ОРД?
ОРД — это аббревиатура от «оперативно-розыскная деятельность». Я коротко поясню, что это значит на практике.`,
            ans: 0, // 0 - отказать
            r: "Отказ! Использование нейросети (ChatGPT) в 31 вопросе."
        },
        {
            t: `Здесь вставляешь полный текст нормальной анкеты.`,
            ans: 1, // 1 - одобрить
            r: "Все отлично, анкета чистая, можно смело принимать."
        }
    ];
    // ==========================================

    let currentIndex = 0;
    let score = 0;

    const appContent = document.getElementById('app-content');
    const progressText = document.getElementById('progress-text');
    const feedback = document.getElementById('feedback');
    const actionButtons = document.getElementById('action-buttons');
    const btnNext = document.getElementById('btn-next');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const finalScore = document.getElementById('final-score');

    function loadApp() {
        feedback.style.display = 'none';
        btnNext.style.display = 'none';
        actionButtons.style.display = 'flex';
        
        progressText.innerText = `Анкета ${currentIndex + 1} из ${db.length}`;
        appContent.innerText = db[currentIndex].t;
    }

    function checkAnswer(decision) {
        actionButtons.style.display = 'none';
        feedback.style.display = 'block';
        btnNext.style.display = 'block';

        const currentApp = db[currentIndex];

        if (decision === currentApp.ans) {
            score++;
            feedback.className = 'correct';
            feedback.innerHTML = `<strong>✅ Правильное решение!</strong><br><br>${currentApp.r}`;
        } else {
            feedback.className = 'wrong';
            feedback.innerHTML = `<strong>❌ Ошибка проверяющего!</strong><br><br>${currentApp.r}`;
        }
    }

    function nextApp() {
        currentIndex++;
        if (currentIndex >= db.length) {
            quizScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            finalScore.innerHTML = `Твой результат: <strong>${score} из ${db.length}</strong> правильных вердиктов.`;
        } else {
            loadApp();
        }
    }

    loadApp();
</script>

</body>
</html>
